<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Contractable</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    /* Prevent arbitrary text zooming mechanics in iOS Safari */
    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      /* Dynamic fluid baseline: scales smoothly with viewports */
      font-size: calc(0.9rem + 0.3vw); 
      box-sizing: border-box;
    }

    *, *:before, *:after {
      box-sizing: inherit;
    }

    /* Global Page Canvas Layout */
    body { 
      font-family: "Apple Braille", "Courier New", monospace; 
      padding: 1.5vh 3vw; /* Fluid paddings bounded by viewport heights/widths */
      background-color: #000000; /* Pure black background */
      color: #ffffff;            /* Stark white global text */
      margin: 0;
      width: 100%;
    }

    /* THE MASTER APP CONTAINER
       ======================================================================
       Added 'text-align: center' here. This forces all inline children blocks 
       (like headings, row text, and status blocks) to automatically align down 
       the absolute central axis of the container across different viewports.
    */
    .app-container {
      width: 100%;
      max-width: 32ch; /* Safe maximum width bound mapped to character limits */
      margin: 0 auto; /* Centers the block container horizontally on large screens */
      font-size: clamp(1.3rem, 5vw, 1.75rem); /* Preserves large dots on small screens, limits upper range */
      text-align: center; /* ALIGNMENT FIX: Centers headers, status text, and buttons down the central axis */
    }
    
    h1 {
      margin-top: 0.5em;
      margin-bottom: 0.5em;
      font-size: 1.2em;
    }

    /* Ensure hidden items are completely invisible to sighted and assistive tech alike */
    [hidden] {
      display: none !important;
    }
    
    #status { 
      margin-top: 0.5em; 
      white-space: pre; 
      font-weight: bold; 
      outline: none; /* Removes the default browser focus ring when focused via JS */
    }

    /* Inline "click to suggest" link that appears inside the status area */
    .suggest-link-btn {
      background: none;
      border: none;
      color: #FFC107;
      text-decoration: underline;
      font-family: sans-serif;
      font-weight: normal;
      font-size: 0.8em;
      white-space: normal;
      cursor: pointer;
      padding: 0;
      margin-left: 0.4em;
      vertical-align: baseline;
    }
    .suggest-link-btn:hover {
      color: #ffd54f;
    }
    .suggest-link-btn:disabled {
      color: #888888;
      text-decoration: none;
      cursor: default;
    }
    
    /* THE GAME BOARD CONTAINER
       ======================================================================
       CRITICAL GAP FIX: Replaced 'white-space: pre-line' with modern vertical 
       flexbox configuration. This eliminates hidden code-formatting indentation 
       gaps entirely while keeping rows correctly isolated as straight lines.
    */
    #game-board { 
      margin-top: 1em; 
      display: flex;
      flex-direction: column;
      gap: 0.15em;
      font-variant-numeric: tabular-nums; /* Keeps all numeric characters exactly uniform in width */
      letter-spacing: 0; /* Lock letter spacing to preserve physical Braille tracking alignments */
      padding: 0.1em 0; /* Tighter padding values to bring rows and header closer together */
      width: 100%;
      text-align: center; /* ALIGNMENT FIX: Forces dynamic rows injected inside to center standardly */
    }
    
    .row { 
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.2vw;
      flex-wrap: nowrap;
      outline: none;
      margin-bottom: 1vh;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .row-label {
      font-size: 0.6em;
      font-family: sans-serif;
      color: #999999;
      flex-shrink: 0;
      width: 3.5vw;
      text-align: right;
    }

    .row-group {
      display: flex;
      gap: 0.7vw;
      flex-shrink: 0;
    }
    
    #controls { 
      margin-top: 1.5em; 
      width: 100%;
    }
    
    #guess-label { 
      display: block; 
      margin-bottom: 0.5em; 
      font-size: 0.9em;
    }
    
    /* Text Input Box */
    #guess-input { 
      font-family: monospace; 
      width: 10ch; 
      /* Bypasses iOS auto-zoom constraints smoothly using rem sizing */
      font-size: 1rem; 
      background-color: #000000; 
      color: #ffffff; 
      border: 0.08rem solid #ffffff; 
      padding: 0.4em;
      vertical-align: middle;
    }
    
    /* High-Contrast Amber Outlined Action Button */
    #submit-btn {
      font-family: sans-serif; 
      background-color: #000000; 
      color: #ffffff;            
      border: 0.125rem solid #FFC107; 
      padding: 0.3em 1em;
      font-weight: bold;
      cursor: pointer;
      font-size: 1.1rem; 
      vertical-align: middle;
      margin-left: 0.4rem;
    }

    #submit-btn:hover {
      background-color: rgba(255, 193, 7, 0.15);
    }

    /* Post-game "suggest words" form, revealed once the round ends */
    #post-game-suggest {
      margin-top: 2em;
      padding-top: 1em;
      border-top: 0.08rem solid #444444;
      width: 100%;
      text-align: center;
    }

    #suggest-heading {
      font-size: 1em;
      font-family: sans-serif;
      margin: 0 0 0.5em;
    }

    #suggest-label {
      display: block;
      font-size: 0.8em;
      font-family: sans-serif;
      color: #cccccc;
      margin-bottom: 0.5em;
    }

    #suggest-input {
      width: 100%;
      max-width: 28ch;
      font-family: monospace;
      font-size: 1rem;
      background-color: #000000;
      color: #ffffff;
      border: 0.08rem solid #ffffff;
      padding: 0.5em;
      resize: vertical;
    }

    #suggest-submit-btn {
      display: block;
      margin: 0.6em auto 0;
      font-family: sans-serif;
      background-color: #000000;
      color: #ffffff;
      border: 0.125rem solid #FFC107;
      padding: 0.3em 1em;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
    }

    #suggest-submit-btn:hover {
      background-color: rgba(255, 193, 7, 0.15);
    }

    #suggest-submit-btn:disabled {
      opacity: 0.6;
      cursor: default;
    }

    #suggest-feedback {
      margin-top: 0.6em;
      font-size: 0.8em;
      font-family: sans-serif;
      color: #FFC107;
      min-height: 1em;
    }

    #suggest-feedback.error {
      color: #ff4d4d;
      font-weight: bold;
    }

    #debug-log { 
      margin-top: 2em; 
      font-size: 0.6em; 
      color: #ff4d4d; /* High-contrast crimson optimized for pitch black surfaces */
      border-top: 0.08rem solid #ccc; 
      padding-top: 0.65rem;
      font-family: monospace;
      width: 100%;
    }

    /* Visually hidden but still available to assistive tech */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Input mode toggle */
    #mode-toggle-wrap {
      margin-top: 1.5em;
    }

    #mode-toggle-btn {
      font-family: sans-serif;
      background-color: #000000;
      color: #ffffff;
      border: 0.1rem solid #666666;
      padding: 0.35em 0.9em;
      cursor: pointer;
      font-size: 0.9rem;
    }

    #mode-toggle-btn:hover {
      border-color: #999999;
    }

    /* ── SIX-KEY ENTRY WIDGET ──────────────────────────────── */
    #sixkey-controls {
      margin-top: 1.5em;
      width: 100%;
    }

    #sixkey-cells {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1vw;
      width: 100%;
      padding: 0.4em 0;
    }

    #sixkey-cells:focus {
      outline: 0.12em dashed #FFC107;
      outline-offset: 0.2em;
    }

    /* Six-key input cells are larger and tappable, unlike the compact,
       static cells used to display board rows above (shared shape lives
       in the .cell/.dot rules above this block). */
    #sixkey-cells .cell {
      gap: 1vw 1vw;
      flex: 1 1 0;
      min-width: 0;
      padding: 0.08em;
      border-radius: 0.3em;
    }

    #sixkey-cells .dot {
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      border: 0.09em solid #ffffff;
    }

    /* One braille cell: 2 cols x 3 rows of dots, standard numbering
       1 4
       2 5
       3 6
       Shared shape used both by the read-only game board rows (compact,
       vw-scaled, non-interactive) and the six-key input widget (larger,
       tappable) — each scopes its own sizing below.
    */
    .cell {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(3, 1fr);
      grid-template-areas:
        "d1 d4"
        "d2 d5"
        "d3 d6";
      flex: 0 0 auto;
    }

    .cell.current-cell {
      outline: 0.15em solid #FFC107;
      outline-offset: 0.1em;
    }

    .dot {
      border-radius: 50%;
      background-color: #000000;
      border: 1px solid #ffffff;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .cell.tappable .dot {
      cursor: pointer;
    }

    .dot.on {
      background-color: #ffffff;
      border-color: #ffffff;
    }

    .dot.dot-1 { grid-area: d1; }
    .dot.dot-2 { grid-area: d2; }
    .dot.dot-3 { grid-area: d3; }
    .dot.dot-4 { grid-area: d4; }
    .dot.dot-5 { grid-area: d5; }
    .dot.dot-6 { grid-area: d6; }

    /* Board rows: compact, static dots sized in vw so a full row (label +
       3 groups of 5 cells = 15 dot-cells) scales down on narrow phones
       instead of overflowing. overflow-x: auto on .row above is a safety
       net if a device still needs it. */
    #game-board .cell {
      gap: 0.5vw 0.5vw;
    }

    #game-board .dot {
      width: 2vw;
      height: 2vw;
    }

    #sixkey-actions {
      margin-top: 1em;
      display: flex;
      justify-content: center;
      gap: 0.6em;
    }

    #sixkey-clear-btn,
    #sixkey-submit-btn {
      font-family: sans-serif;
      background-color: #000000;
      color: #ffffff;
      border: 0.125rem solid #FFC107;
      padding: 0.3em 1em;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
    }

    #sixkey-clear-btn {
      border-color: #666666;
      font-weight: normal;
    }

    #sixkey-clear-btn:hover { border-color: #999999; }
    #sixkey-submit-btn:hover { background-color: rgba(255, 193, 7, 0.15); }

    #sixkey-clear-btn:disabled,
    #sixkey-submit-btn:disabled {
      opacity: 0.5;
      cursor: default;
    }
  </style>
</head>
<body>

  <div class="app-container">

    <h1 aria-label="CONTRACTABLE" aria-braillelabel="⠠⠠⠒⠞⠗⠁⠉⠞⠁⠃⠇⠑">
      <span aria-hidden="true">⠠⠠⠒⠞⠗⠁⠉⠞⠁⠃⠇⠑⠀</span>
    </h1>

    <div id="game-board" aria-live="polite">
      <div 
        id="header" 
        role="text"
        aria-label="correct, guess, wrong"
        aria-braillelabel="⠉⠕⠗⠗⠑⠉⠞⠀⠛⠥⠑⠎⠎⠀⠺⠗⠰⠛"><span aria-hidden="true">⠉⠕⠗⠗⠑⠉⠞⠀⠛⠥⠑⠎⠎⠀⠺⠗⠰⠛</span></div>
    </div>

    <div id="status" tabindex="-1" hidden></div>

    <div id="controls">
      <label id="guess-label" for="guess-input" aria-hidden="true">⠛⠥⠑⠎⠎</label>
      <input 
        id="guess-input" 
        type="text" 
        aria-label="guess"
        aria-braillelabel="⠛⠥⠑⠎⠎"
        autocomplete="off" 
        autocapitalize="off" 
        spellcheck="false" />
      <button id="submit-btn" aria-label="submit" aria-braillelabel="⠎⠥⠃⠍⠊⠞">⠎⠥⠃⠍⠊⠞</button>
    </div>

    <div id="mode-toggle-wrap">
      <button id="mode-toggle-btn" type="button">Switch to 6-key entry</button>
    </div>

    <!-- Six-key braille entry: 5 cells x 6 dots. Hidden unless the player
         has switched into this input mode. Keyboard chording uses S D F
         (dots 3,2,1) and J K L (dots 4,5,6); dots can also be tapped or
         clicked directly. -->
    <div id="sixkey-controls" hidden>
      <div
        id="sixkey-cells"
        role="group"
        aria-label="Six key braille entry, five cells. Hold S D F and J K L together to set dots, release to commit a cell. Tap or click dots directly. Arrow keys or Tab move between cells."
        tabindex="0"
      >
        <span class="cell tappable" data-cell="0">
          <span class="dot dot-1" data-cell="0" data-dot="1"></span>
          <span class="dot dot-2" data-cell="0" data-dot="2"></span>
          <span class="dot dot-3" data-cell="0" data-dot="3"></span>
          <span class="dot dot-4" data-cell="0" data-dot="4"></span>
          <span class="dot dot-5" data-cell="0" data-dot="5"></span>
          <span class="dot dot-6" data-cell="0" data-dot="6"></span>
        </span>
        <span class="cell tappable" data-cell="1">
          <span class="dot dot-1" data-cell="1" data-dot="1"></span>
          <span class="dot dot-2" data-cell="1" data-dot="2"></span>
          <span class="dot dot-3" data-cell="1" data-dot="3"></span>
          <span class="dot dot-4" data-cell="1" data-dot="4"></span>
          <span class="dot dot-5" data-cell="1" data-dot="5"></span>
          <span class="dot dot-6" data-cell="1" data-dot="6"></span>
        </span>
        <span class="cell tappable" data-cell="2">
          <span class="dot dot-1" data-cell="2" data-dot="1"></span>
          <span class="dot dot-2" data-cell="2" data-dot="2"></span>
          <span class="dot dot-3" data-cell="2" data-dot="3"></span>
          <span class="dot dot-4" data-cell="2" data-dot="4"></span>
          <span class="dot dot-5" data-cell="2" data-dot="5"></span>
          <span class="dot dot-6" data-cell="2" data-dot="6"></span>
        </span>
        <span class="cell tappable" data-cell="3">
          <span class="dot dot-1" data-cell="3" data-dot="1"></span>
          <span class="dot dot-2" data-cell="3" data-dot="2"></span>
          <span class="dot dot-3" data-cell="3" data-dot="3"></span>
          <span class="dot dot-4" data-cell="3" data-dot="4"></span>
          <span class="dot dot-5" data-cell="3" data-dot="5"></span>
          <span class="dot dot-6" data-cell="3" data-dot="6"></span>
        </span>
        <span class="cell tappable" data-cell="4">
          <span class="dot dot-1" data-cell="4" data-dot="1"></span>
          <span class="dot dot-2" data-cell="4" data-dot="2"></span>
          <span class="dot dot-3" data-cell="4" data-dot="3"></span>
          <span class="dot dot-4" data-cell="4" data-dot="4"></span>
          <span class="dot dot-5" data-cell="4" data-dot="5"></span>
          <span class="dot dot-6" data-cell="4" data-dot="6"></span>
        </span>
      </div>

      <div id="sixkey-live" class="sr-only" aria-live="polite"></div>

      <div id="sixkey-actions">
        <button id="sixkey-clear-btn" type="button">clear</button>
        <button id="sixkey-submit-btn" type="button">submit</button>
      </div>
    </div>

    <!-- Post-game suggestion form: hidden until the round ends (win or lose) -->
    <div id="post-game-suggest" hidden>
      <h2 id="suggest-heading">Suggest words for the game</h2>
      <label id="suggest-label" for="suggest-input">
        One or more words, separated by spaces or line breaks. Each is checked against
        Grade 2 UEB braille translation and only sent if it comes out to exactly 5 cells.
      </label>
      <textarea
        id="suggest-input"
        rows="4"
        placeholder="e.g. planet roughly spiritual"
        aria-label="Suggest words for the game"
        autocapitalize="off"
        spellcheck="false"></textarea>
      <button id="suggest-submit-btn" type="button">Send suggestions</button>
      <div id="suggest-feedback" role="status" aria-live="polite"></div>
    </div>

    <div id="debug-log"></div>

  </div>

  <script src="main.js"></script>
</body>
</html>
