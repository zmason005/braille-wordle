<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Contractable</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    /* Prevent arbitrary text zooming mechanics in iOS Safari */
    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      /* Dynamic fluid baseline: scales smoothly with viewports */
      font-size: calc(0.9rem + 0.3vw);
      box-sizing: border-box;
    }

    *, *:before, *:after {
      box-sizing: inherit;
    }

    /* Global Page Canvas Layout */
    body {
      font-family: "Apple Braille", "Courier New", monospace;
      padding: 1.5vh 3vw;
      background-color: #000000;
      color: #ffffff;
      margin: 0;
      width: 100%;
    }

    /* THE MASTER APP CONTAINER */
    .app-container {
      width: 100%;
      max-width: 32ch;
      margin: 0 auto;
      font-size: clamp(1.3rem, 5vw, 1.75rem);
      text-align: center;
    }

    h1 {
      margin-top: 0.5em;
      margin-bottom: 0.5em;
      font-size: 1.2em;
    }

    [hidden] {
      display: none !important;
    }

    #status {
      margin-top: 0.5em;
      white-space: pre;
      font-weight: bold;
      outline: none;
    }

    /* Inline "click to suggest" link */
    .suggest-link-btn {
      background: none;
      border: none;
      color: #FFC107;
      text-decoration: underline;
      font-family: sans-serif;
      font-weight: normal;
      font-size: 0.8em;
      white-space: normal;
      cursor: pointer;
      padding: 0;
      margin-left: 0.4em;
      vertical-align: baseline;
    }

    .suggest-link-btn:hover {
      color: #ffd54f;
    }

    .suggest-link-btn:disabled {
      color: #888888;
      text-decoration: none;
      cursor: default;
    }

    /* ================================================================
       GAME BOARD GEOMETRY

       The board has three equal five-cell columns:

         CORRECT | GUESS | WRONG
         --------+-------+------
         row id  |       |

       The row label belongs to the CORRECT column. Therefore the
       CORRECT header is centered over the row label plus the five
       Correct cells.

       All three game columns use the same calculated width so the
       headers and every game row share exactly the same horizontal
       geometry.
       ================================================================ */

    #game-board {
      /* Board geometry variables */
      --board-cell-size: 2vw;
      --board-dot-gap: 0.4vw;
      --board-cell-gap: 1.4vw;

      /* Width of five Braille cells plus the four spaces between them */
      --board-column-width:
        calc(
          (5 * (2 * var(--board-cell-size) + var(--board-dot-gap)))
          + (4 * var(--board-cell-gap))
        );

      margin-top: 1em;
      display: flex;
      flex-direction: column;
      gap: 0.15em;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0;
      padding: 0.1em 0;
      width: 100%;
      text-align: center;
    }

    /*
      Every board row uses the same three-column geometry.

      Column 1 is intentionally wider because it contains the row ID
      plus the five Correct cells. This makes the CORRECT heading sit
      over the row ID and Correct cells together.

      Columns 2 and 3 are exactly the width of one five-cell group.
    */
    .row {
      display: grid;
      grid-template-columns:
        calc(3.5vw + var(--board-column-width))
        var(--board-column-width)
        var(--board-column-width);
      column-gap: 2.5vw;
      align-items: center;
      justify-content: center;
      flex-wrap: nowrap;
      outline: none;
      margin-bottom: 1vh;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    /*
      The row label is part of the first grid column rather than a
      separate spacing element. This allows CORRECT to align over both
      the label and its five-cell group.
    */
    .row-label {
      font-size: 0.6em;
      font-family: sans-serif;
      color: #999999;
      flex-shrink: 0;
      width: 3.5vw;
      text-align: right;
    }

    .row-group {
      display: flex;
      width: var(--board-column-width);
      min-width: var(--board-column-width);
      gap: var(--board-cell-gap);
      flex-shrink: 0;
      justify-content: center;
    }

    /*
      The first board group and row label occupy the first grid column.
      This wrapper is expected to be created by main.js when rows are
      rendered.
    */
    .row > .row-label {
      grid-column: 1;
    }

    .row > .row-group:nth-of-type(1) {
      grid-column: 1;
    }

    .row > .row-group:nth-of-type(2) {
      grid-column: 2;
    }

    .row > .row-group:nth-of-type(3) {
      grid-column: 3;
    }

    /*
      Header geometry.

      The header uses the same three-column structure as the game rows.
      CORRECT therefore occupies the entire first column, including the
      row-ID area, while GUESS and WRONG occupy their corresponding
      five-cell columns.
    */
    #header {
      display: grid;
      grid-template-columns:
        calc(3.5vw + var(--board-column-width))
        var(--board-column-width)
        var(--board-column-width);
      column-gap: 2.5vw;
      align-items: center;
      justify-content: center;
      width: max-content;
      max-width: 100%;
      margin-left: auto;
      margin-right: auto;
    }

    #header .row-label {
      grid-column: 1;
      width: 100%;
      text-align: center;
    }

    #header .row-group {
      width: var(--board-column-width);
      min-width: var(--board-column-width);
      justify-content: center;
    }

    #header .row-group:nth-of-type(1) {
      grid-column: 1;
    }

    #header .row-group:nth-of-type(2) {
      grid-column: 2;
    }

    #header .row-group:nth-of-type(3) {
      grid-column: 3;
    }

    #controls {
      margin-top: 1.5em;
      width: 100%;
    }

    #guess-label {
      display: block;
      margin-bottom: 0.5em;
      font-size: 0.9em;
    }

    #guess-input {
      font-family: monospace;
      width: 10ch;
      font-size: 1rem;
      background-color: #000000;
      color: #ffffff;
      border: 0.08rem solid #ffffff;
      padding: 0.4em;
      vertical-align: middle;
    }

    #submit-btn {
      font-family: sans-serif;
      background-color: #000000;
      color: #ffffff;
      border: 0.125rem solid #FFC107;
      padding: 0.3em 1em;
      font-weight: bold;
      cursor: pointer;
      font-size: 1.1rem;
      vertical-align: middle;
      margin-left: 0.4rem;
    }

    #submit-btn:hover {
      background-color: rgba(255, 193, 7, 0.15);
    }

    #post-game-suggest {
      margin-top: 2em;
      padding-top: 1em;
      border-top: 0.08rem solid #444444;
      width: 100%;
      text-align: center;
    }

    #suggest-heading {
      font-size: 1em;
      font-family: sans-serif;
      margin: 0 0 0.5em;
    }

    #suggest-label {
      display: block;
      font-size: 0.8em;
      font-family: sans-serif;
      color: #cccccc;
      margin-bottom: 0.5em;
    }

    #suggest-input {
      width: 100%;
      max-width: 28ch;
      font-family: monospace;
      font-size: 1rem;
      background-color: #000000;
      color: #ffffff;
      border: 0.08rem solid #ffffff;
      padding: 0.5em;
      resize: vertical;
    }

    #suggest-submit-btn {
      display: block;
      margin: 0.6em auto 0;
      font-family: sans-serif;
      background-color: #000000;
      color: #ffffff;
      border: 0.125rem solid #FFC107;
      padding: 0.3em 1em;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
    }

    #suggest-submit-btn:hover {
      background-color: rgba(255, 193, 7, 0.15);
    }

    #suggest-submit-btn:disabled {
      opacity: 0.6;
      cursor: default;
    }

    #suggest-feedback {
      margin-top: 0.6em;
      font-size: 0.8em;
      font-family: sans-serif;
      color: #FFC107;
      min-height: 1em;
    }

    #suggest-feedback.error {
      color: #ff4d4d;
      font-weight: bold;
    }

    #debug-log {
      margin-top: 2em;
      font-size: 0.6em;
      color: #ff4d4d;
      border-top: 0.08rem solid #ccc;
      padding-top: 0.65rem;
      font-family: monospace;
      width: 100%;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    #mode-toggle-wrap {
      margin-top: 1.5em;
    }

    #mode-toggle-btn {
      font-family: sans-serif;
      background-color: #000000;
      color: #ffffff;
      border: 0.1rem solid #666666;
      padding: 0.35em 0.9em;
      cursor: pointer;
      font-size: 0.9rem;
    }

    #mode-toggle-btn:hover {
      border-color: #999999;
    }

    /* ── SIX-KEY ENTRY WIDGET ──────────────────────────────── */

    #sixkey-controls {
      margin-top: 1.5em;
      width: 100%;
    }

    #sixkey-cells {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1vw;
      width: 100%;
      padding: 0.4em 0;
    }

    #sixkey-cells:focus {
      outline: 0.12em dashed #FFC107;
      outline-offset: 0.2em;
    }

    #sixkey-cells .cell {
      gap: 1vw 1vw;
      flex: 1 1 0;
      min-width: 0;
      padding: 0.08em;
      border-radius: 0.3em;
    }

    #sixkey-cells .dot {
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      border: 0.09em solid #ffffff;
    }

    /* One braille cell: 2 cols x 3 rows
       1 4
       2 5
       3 6 */
    .cell {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(3, 1fr);
      grid-template-areas:
        "d1 d4"
        "d2 d5"
        "d3 d6";
      flex: 0 0 auto;
    }

    .cell.current-cell {
      outline: 0.15em solid #FFC107;
      outline-offset: 0.1em;
    }

    .dot {
      border-radius: 50%;
      background-color: #8b0000;
      border: 1px solid #8b0000;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .cell.tappable .dot {
      cursor: pointer;
    }

    .dot.on {
      background-color: #ffffff;
      border-color: #ffffff;
    }

    .dot-label {
      background-color: transparent;
      border-color: transparent;
    }

    .dot-label.on {
      background-color: #ffffff;
      border-color: #ffffff;
    }

    .dot.dot-1 { grid-area: d1; }
    .dot.dot-2 { grid-area: d2; }
    .dot.dot-3 { grid-area: d3; }
    .dot.dot-4 { grid-area: d4; }
    .dot.dot-5 { grid-area: d5; }
    .dot.dot-6 { grid-area: d6; }

    /* Board cells use the shared geometry variables */
    #game-board .cell {
      gap: var(--board-dot-gap) var(--board-dot-gap);
    }

    #game-board .dot {
      width: var(--board-cell-size);
      height: var(--board-cell-size);
    }

    /* ── HEADING (h1) NESTED-SPAN CELLS ───────────────────── */

    #heading-cells {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 0.3em;
      vertical-align: middle;
    }

    #heading-cells .cell {
      gap: 0.12em 0.12em;
    }

    #heading-cells .dot {
      width: 0.5em;
      height: 0.5em;
      border-width: 0.05em;
    }

    #sixkey-actions {
      margin-top: 1em;
      display: flex;
      justify-content: center;
      gap: 0.6em;
    }

    #sixkey-clear-btn,
    #sixkey-submit-btn {
      font-family: sans-serif;
      background-color: #000000;
      color: #ffffff;
      border: 0.125rem solid #FFC107;
      padding: 0.3em 1em;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
    }

    #sixkey-clear-btn {
      border-color: #666666;
      font-weight: normal;
    }

    #sixkey-clear-btn:hover {
      border-color: #999999;
    }

    #sixkey-submit-btn:hover {
      background-color: rgba(255, 193, 7, 0.15);
    }

    #sixkey-clear-btn:disabled,
    #sixkey-submit-btn:disabled {
      opacity: 0.5;
      cursor: default;
    }
  </style>
</head>

<body>

  <div class="app-container">

    <h1
      aria-label="CONTRACTABLE"
      aria-braillelabel="⠠⠠⠒⠞⠗⠁⠉⠞⠁⠃⠇⠑"
    >
      <span id="heading-cells" aria-hidden="true"></span>
    </h1>

    <div id="game-board" aria-live="polite">

      <div
        id="header"
        class="row"
        role="text"
        aria-label="correct, guess, wrong"
        aria-braillelabel="⠉⠕⠗⠗⠑⠉⠞⠀⠛⠥⠑⠎⠎⠀⠺⠗⠰⠛"
      ></div>

    </div>

    <div id="status" tabindex="-1" hidden></div>

    <div id="controls">

      <label id="guess-label" for="guess-input" aria-hidden="true">
        ⠛⠥⠑⠎⠎
      </label>

      <input
        id="guess-input"
        type="text"
        aria-label="guess"
        aria-braillelabel="⠛⠥⠑⠎⠎"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
      />

      <button
        id="submit-btn"
        aria-label="submit"
        aria-braillelabel="⠎⠥⠃⠍⠊⠞"
      >⠎⠥⠃⠍⠊⠞</button>

    </div>

    <div id="mode-toggle-wrap">
      <button id="mode-toggle-btn" type="button">
        Switch to 6-key entry
      </button>
    </div>

    <!-- Six-key braille entry -->
    <div id="sixkey-controls" hidden>

      <div
        id="sixkey-cells"
        role="group"
        aria-label="Six key braille entry, five cells. Hold S D F and J K L together to set dots, release to commit a cell. Tap or click dots directly. Arrow keys or Tab move between cells."
        tabindex="0"
      >

        <span class="cell tappable" data-cell="0">
          <span class="dot dot-1" data-cell="0" data-dot="1"></span>
          <span class="dot dot-2" data-cell="0" data-dot="2"></span>
          <span class="dot dot-3" data-cell="0" data-dot="3"></span>
          <span class="dot dot-4" data-cell="0" data-dot="4"></span>
          <span class="dot dot-5" data-cell="0" data-dot="5"></span>
          <span class="dot dot-6" data-cell="0" data-dot="6"></span>
        </span>

        <span class="cell tappable" data-cell="1">
          <span class="dot dot-1" data-cell="1" data-dot="1"></span>
          <span class="dot dot-2" data-cell="1" data-dot="2"></span>
          <span class="dot dot-3" data-cell="1" data-dot="3"></span>
          <span class="dot dot-4" data-cell="1" data-dot="4"></span>
          <span class="dot dot-5" data-cell="1" data-dot="5"></span>
          <span class="dot dot-6" data-cell="1" data-dot="6"></span>
        </span>

        <span class="cell tappable" data-cell="2">
          <span class="dot dot-1" data-cell="2" data-dot="1"></span>
          <span class="dot dot-2" data-cell="2" data-dot="2"></span>
          <span class="dot dot-3" data-cell="2" data-dot="3"></span>
          <span class="dot dot-4" data-cell="2" data-dot="4"></span>
          <span class="dot dot-5" data-cell="2" data-dot="5"></span>
          <span class="dot dot-6" data-cell="2" data-dot="6"></span>
        </span>

        <span class="cell tappable" data-cell="3">
          <span class="dot dot-1" data-cell="3" data-dot="1"></span>
          <span class="dot dot-2" data-cell="3" data-dot="2"></span>
          <span class="dot dot-3" data-cell="3" data-dot="3"></span>
          <span class="dot dot-4" data-cell="3" data-dot="4"></span>
          <span class="dot dot-5" data-cell="3" data-dot="5"></span>
          <span class="dot dot-6" data-cell="3" data-dot="6"></span>
        </span>

        <span class="cell tappable" data-cell="4">
          <span class="dot dot-1" data-cell="4" data-dot="1"></span>
          <span class="dot dot-2" data-cell="4" data-dot="2"></span>
          <span class="dot dot-3" data-cell="4" data-dot="3"></span>
          <span class="dot dot-4" data-cell="4" data-dot="4"></span>
          <span class="dot dot-5" data-cell="4" data-dot="5"></span>
          <span class="dot dot-6" data-cell="4" data-dot="6"></span>
        </span>

      </div>

      <div id="sixkey-live" class="sr-only" aria-live="polite"></div>

      <div id="sixkey-actions">
        <button id="sixkey-clear-btn" type="button">clear</button>
        <button id="sixkey-submit-btn" type="button">submit</button>
      </div>

    </div>

    <!-- Post-game suggestion form -->
    <div id="post-game-suggest" hidden>

      <h2 id="suggest-heading">Suggest words for the game</h2>

      <label id="suggest-label" for="suggest-input">
        One or more words, separated by spaces or line breaks. Each is checked
        against Grade 2 UEB braille translation and only sent if it comes out
        to exactly 5 cells.
      </label>

      <textarea
        id="suggest-input"
        rows="4"
        placeholder="e.g. planet roughly spiritual"
        aria-label="Suggest words for the game"
        autocapitalize="off"
        spellcheck="false"
      ></textarea>

      <button id="suggest-submit-btn" type="button">
        Send suggestions
      </button>

      <div
        id="suggest-feedback"
        role="status"
        aria-live="polite"
      ></div>

    </div>

    <div id="debug-log"></div>

  </div>

  <script src="main.js"></script>

</body>
</html>
