name: Import New Words

on:
  push:
    branches: [main]
    paths:
      - new-words.txt
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run import script
        id: import
        run: node scripts/import-words.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- daily-word4.json new-words.txt; then
            echo "No changes to commit."
            exit 0
          fi

          git add daily-word4.json new-words.txt
          git commit -m "Import ${{ steps.import.outputs.accepted_count }} word(s), reject ${{ steps.import.outputs.rejected_count }}"
          git push
